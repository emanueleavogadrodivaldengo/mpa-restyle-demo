<!-- BLOCCO newsletter → un solo campo. L'invio vero si collega al servizio di newsletter di MPA -->
<div class="newsletter">
  <div>
    <h2 class="section-title" id="t-newsletter">Le news della settimana nella tua email</h2>
    <p>Una email con le notizie più lette e le fiere in arrivo. Ti cancelli quando vuoi.</p>
  </div>
  <form class="newsletter__form" action="#" method="post">
    <label class="visually-hidden" for="nl-email">La tua email</label>
    <input id="nl-email" type="email" name="email" placeholder="La tua email" autocomplete="email" required>
    <button class="button" type="submit">Iscriviti</button>
  </form>
</div>
