<!-- BLOCCO cover → copertina di una rivista (template-parts/cover.php). Segnaposto: sul sito vero c'è la foto della copertina -->
<a class="cover" href="{{url}}" data-rivista="{{key}}">
  <span class="cover__art" role="img" aria-label="Copertina segnaposto di {{name}}">
    <span class="cover__kicker">{{audience}}</span>
    <span class="cover__name">{{name}}</span>
    <span class="cover__ph">Copertina segnaposto</span>
  </span>
  <span class="cover__caption"><strong>{{name}}</strong> {{issue}}</span>
</a>
